const un=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function abre(P){
 const st=document.createElement('style');st.textContent=P.css;document.head.appendChild(st);
 const app=document.getElementById('app');app.innerHTML='<div id="dash-root">'+P.body+'</div>';
 const DR={},CA={};
 const dash={colors:[],data:(id)=>{if(P.data[id])return{status:'ok',data:P.data[id]};if(CA[id])return{status:'ok',data:CA[id].fn(...CA[id].inputs.map(i=>dash.data(i).data))};return{status:'missing',data:[]}},draw:(n,f)=>{if(f){DR[n]=f;return}document.querySelectorAll('[data-draw="'+n+'"]').forEach(el=>{if(!el.closest('[hidden]'))DR[n](el)})},setLink(){},calc(id,o){CA[id]=o},onData(f){f()}};
 const d3={group:(a,k)=>{const m=new Map();a.forEach(x=>{const c=k(x);m.has(c)?m.get(c).push(x):m.set(c,[x])});return m}};
 new Function('dash','d3',P.js)(dash,d3);
 document.getElementById('entrar').remove();app.hidden=false;
 Object.keys(DR).forEach(n=>dash.draw(n));
}
document.getElementById('f').addEventListener('submit',async(e)=>{
 e.preventDefault();const msg=document.getElementById('msg'),b=document.getElementById('b');msg.textContent='';
 if(!window.crypto||!crypto.subtle){msg.textContent='Abra este arquivo no navegador (Chrome, Edge, Safari ou Firefox).';return}
 b.disabled=true;b.textContent='Abrindo...';
 try{
  const t=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',t.encode(document.getElementById('u').value.trim().toLowerCase()+'\n'+document.getElementById('p').value),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:un(C.salt),iterations:C.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  let puro;try{puro=await crypto.subtle.decrypt({name:'AES-GCM',iv:un(C.iv)},key,un(C.ct))}catch(_){msg.textContent='Usuário ou senha incorretos.';return}
  abre(JSON.parse(new TextDecoder().decode(puro)));
 }catch(x){msg.textContent='Não foi possível abrir. Tente no Chrome, Edge, Safari ou Firefox.'}
 finally{if(document.getElementById('b')){b.disabled=false;b.textContent='Entrar'}}
});
</script></body></html>
